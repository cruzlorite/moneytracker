name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs, as in GitHub's own template: the deploy job starts once the upload is fully registered
  # (in one job, deploy-pages sometimes couldn't find the artifact it had just been given).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp the version
        run: printf "export const VERSION = '%s';\n" "${GITHUB_SHA::7}" > js/version.js
      # No build step: the repo is published as is (upload-pages-artifact already excludes .git and .github).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
